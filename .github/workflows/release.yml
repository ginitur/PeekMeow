name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    name: macOS build and package
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and test
        run: |
          swift build --product PeekMeow
          swift run PeekMeowCoreTests

      - name: Build app and zip
        run: ./scripts/build-app.sh

      - name: Check packaged resources
        run: |
          set -euo pipefail
          app="dist/PeekMeow.app"
          test -f "$app/Contents/Resources/AppIcon.icns"
          test -f "$app/Contents/Resources/PeekMeowMark.png"
          test -f "$app/Contents/Resources/PeekMeowAtmosphere.png"
          sips -g pixelWidth -g pixelHeight "$app/Contents/Resources/PeekMeowMark.png"
          version="$(tr -d '[:space:]' < VERSION)"
          tag="${GITHUB_REF_NAME#v}"
          test "$version" = "$tag"
          short="$(plutil -extract CFBundleShortVersionString raw -o - "$app/Contents/Info.plist")"
          commit="$(plutil -extract PeekMeowCommit raw -o - "$app/Contents/Info.plist")"
          test "$short" = "$tag"
          test -n "$commit"
          test "$commit" != "unknown"
          "$app/Contents/MacOS/PeekMeow" --version
          smoke="$("$app/Contents/MacOS/PeekMeow" --smoke-expanded)"
          printf '%s\n' "$smoke"
          printf '%s\n' "$smoke" | grep -q "mark: yes"

      - name: Upload macOS zip
        uses: actions/upload-artifact@v4
        with:
          name: macos-zip
          path: dist/PeekMeow-macOS-*.zip
          retention-days: 1
          if-no-files-found: error

  windows:
    name: Windows build and package
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore windows/PeekMeow.Windows.sln

      - name: Build
        run: dotnet build windows/PeekMeow.Windows.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test windows/PeekMeow.Windows.sln --configuration Release --no-build

      - name: Publish self-contained win-x64
        run: dotnet publish windows/src/PeekMeow.Windows/PeekMeow.Windows.csproj --configuration Release --runtime win-x64 --self-contained true --output windows/dist/PeekMeow-Windows-x64

      - name: Reject packaged user data and zip
        shell: pwsh
        run: |
          $out = "windows/dist/PeekMeow-Windows-x64"
          if (-not (Test-Path "$out/PeekMeow.exe")) { throw "PeekMeow.exe is missing." }
          $bad = @(Get-ChildItem $out -Recurse -File | Where-Object {
            $_.Name -eq "settings.json" -or $_.Extension -in ".sqlite", ".sqlite-shm", ".sqlite-wal"
          })
          if ($bad.Count -gt 0) { throw "User data was packaged." }
          $version = (Get-Content VERSION -Raw).Trim()
          Compress-Archive -Path "$out/*" -DestinationPath "windows/dist/PeekMeow-Windows-x64-$version.zip"

      - name: Startup smoke
        timeout-minutes: 2
        shell: pwsh
        run: |
          $exe = Join-Path (Resolve-Path "windows/dist/PeekMeow-Windows-x64") "PeekMeow.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--smoke" -PassThru
          if (-not $process.WaitForExit(90000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "PeekMeow.exe --smoke did not exit within 90 seconds."
          }
          $process.Refresh()
          if ($process.ExitCode -ne 0) { throw "PeekMeow.exe --smoke exited $($process.ExitCode)." }

      - name: Version and UI resource smoke
        timeout-minutes: 2
        shell: pwsh
        run: |
          $exe = Join-Path (Resolve-Path "windows/dist/PeekMeow-Windows-x64") "PeekMeow.exe"
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = "${{ github.ref_name }}"
          if ($tag -ne "v$version") { throw "VERSION $version does not match tag $tag." }
          function Invoke-Peek([string]$Argument) {
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = $exe
            $psi.Arguments = $Argument
            $psi.UseShellExecute = $false
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $proc = [System.Diagnostics.Process]::Start($psi)
            $stdout = $proc.StandardOutput.ReadToEnd()
            $stderr = $proc.StandardError.ReadToEnd()
            if (-not $proc.WaitForExit(20000)) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              throw "PeekMeow.exe $Argument did not exit."
            }
            Write-Host $stdout
            Write-Host $stderr
            if ($proc.ExitCode -ne 0) { throw "PeekMeow.exe $Argument exited $($proc.ExitCode)." }
            return $stdout + $stderr
          }
          $reported = Invoke-Peek "--version"
          if ($reported -notlike "*$version*") { throw "version output did not contain ${version}: $reported" }
          Invoke-Peek "--smoke-ui" | Out-Null

      - name: Upload Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: windows/dist/PeekMeow-Windows-x64-*.zip
          retention-days: 1
          if-no-files-found: error

  github:
    name: Create GitHub Release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Checksums and pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f -name '*.zip' -exec cp {} release/ \;
          cd release
          mac_zip="$(ls PeekMeow-macOS-*.zip)"
          win_zip="$(ls PeekMeow-Windows-x64-*.zip)"
          test -n "$mac_zip"
          test -n "$win_zip"
          sha256sum "$mac_zip" "$win_zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          cat > notes.md <<EOF
          ## PeekMeow ${tag}

          This is a pre-release candidate for acceptance testing.

          ### macOS

          - Left / Right / Bottom edge
          - Daily tasks
          - Categories
          - Notes
          - Subtasks
          - SQLite persistence
          - Resizable panel
          - Background images
          - Appearance preferences
          - Cat app icon
          - All Tasks filter and locale date header
          - Calligraphic 23 in the lower-right corner, with text kept outside it

          ### Windows

          - Left / Right / Bottom edge
          - Daily tasks
          - Categories
          - Notes
          - Subtasks
          - SQLite persistence
          - Resizable panel
          - Appearance/background
          - System tray
          - Cat app icon
          - Category menu owned by the panel
          - Live appearance preview
          - Faint gold mark in the panel corner

          ### Known limitations

          - Windows UI has automated logic/build validation but still needs device-level interaction validation
          - Windows category-menu z-order is guarded in code; a real Windows click is still required before acceptance
          - Automated smoke does not replace device validation of hover, the category window, the quote, or the corner mark
          - macOS build is not notarized
          - The macOS download is built on macos-15 for Apple silicon (arm64)
          - Top edge is not supported
          - No cloud sync

          ### Checksums

          See SHA256SUMS.txt. The macOS zip is ${mac_zip}. The Windows zip is ${win_zip}. Version ${version}.
          EOF
          args=(release create "$tag" --title "PeekMeow $tag" --notes-file notes.md)
          if [[ "$tag" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}" "$mac_zip" "$win_zip" SHA256SUMS.txt
